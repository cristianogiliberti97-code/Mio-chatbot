<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Il mio Chatbot</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    #chat { border: 1px solid #ddd; height: 400px; overflow-y: auto; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
    .user { text-align: right; color: #0070f3; margin: 8px 0; }
    .assistant { text-align: left; color: #333; margin: 8px 0; }
    input { width: 75%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    button { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>💬 Chatbot</h2>
  <div id="chat"></div>
  <input id="input" placeholder="Scrivi un messaggio..." onkeydown="if(event.key==='Enter') send()" />
  <button onclick="send()">Invia</button>

  <script>
    const history = [];

    async function send() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      history.push({ role: 'user', content: text });
      addMessage('user', text);

      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      history.push({ role: 'assistant', content: data.reply });
      addMessage('assistant', data.reply);
    }

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = role;
      div.textContent = (role === 'user' ? '🧑 ' : '🤖 ') + text;
      document.getElementById('chat').appendChild(div);
      document.getElementById('chat').scrollTop = 9999;
    }
  </script>
</body>
</html>
